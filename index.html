              { id: "r2_vb_2", type: "text", q: "The price of this electric guitar [   ] a guitar case, a stand, and a cable. (includeなど)", a: ["includes", "include"], exp: "「このエレキギターの値段にはギターケース，スタンド，シールド（ギターケーブル）が含まれている」", audio: "The price of this electric guitar includes a guitar case, a stand, and a cable." },
              { id: "r2_vb_3", type: "text", q: "These days, the [   ] of teenagers have their own social media accounts. (majorityなど)", a: "majority", exp: "「近頃，10代の若者の大多数が自分のSNSアカウントを持っている」", audio: "These days, the majority of teenagers have their own social media accounts." },
              { id: "r2_vb_4", type: "text", q: "Vincent felt better after moderate [   ] exercise. (physicalなど)", a: "physical", exp: "「ヴィンセントは適度な体の運動の後，気分がよくなった」", audio: "Vincent felt better after moderate physical exercise." }
            ]
          },
          {
            title: "Vocabulary C",
            instruction: "日本語の意味に合うように、空所に適切な語を入力しなさい。",
            questions: [
              { id: "r2_vc_1", type: "text", q: "キャサリンはeスポーツではなく従来のスポーツが好きです。\nKathryn likes traditional sports [   ] [   ] to esports.", a: "as opposed", exp: "「…ではなく，…とは対照的に」は as opposed to ...で表す。", audio: "Kathryn likes traditional sports as opposed to esports." },
              { id: "r2_vc_2", type: "text", q: "その工場は大きな需要に追いつくため，生産を増やしました。\nThe factory increased production to [   ] [   ] with the high demand.", a: "keep up", exp: "「…に追いつく，…についていく」はkeep up with ...。", audio: "The factory increased production to keep up with the high demand." },
              { id: "r2_vc_3", type: "text", q: "その勉強会は，教育水準にかかわらずあらゆる人々を受け入れています。\nThe study session accepts all people [   ] [   ] their education levels.", a: "regardless of", exp: "「…にかかわらず」はregardless of ...で表す。", audio: "The study session accepts all people regardless of their education levels." }
            ]
          },
          {
            title: "Comprehension D",
            instruction: "記事の著者の意見に合うものを全て選びなさい。",
            questions: [
              { id: "r2_cd_1", type: "multiselect", options: ["a", "b", "c", "d", "e"], q: "a. As a general rule, physical nature makes sports “sports”.\nb. Games like chess should be recognized as sports.\nc. Esports are not so much commercial as non-commercial.\nd. Esports industry will be in decline because it ignores diversity.\ne. Salaries that workers in the esports industry get need to be raised.", a: ["a"], exp: "aが正解です。\n著者は「概して（As a general rule）、身体的な性質（体を動かすこと）がスポーツを『スポーツ』たらしめている」と述べており、それが一般的な認識であるという見解を示しています。\n\n[その他の選択肢が不正解である理由]\nb: チェスのようなゲームをスポーツとして認識すべきとは主張していません。\nc: eスポーツが商業的でない(non-commercial)という記述はありません。\nd: 多様性を無視しているため衰退するという記述はありません。\ne: 給与を引き上げるべきだという主張はされていません。", audio: "a. As a general rule, physical nature makes sports 'sports'." }
            ]
          }
        ]
      }
    ];

    // --- 音声録音フック ---
    const useAudioRecorder = () => {
      const [isRecording, setIsRecording] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          
          mediaRecorderRef.current.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunksRef.current.push(event.data);
            }
          };

          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const url = URL.createObjectURL(audioBlob);
            setAudioUrl(url);
            audioChunksRef.current = [];
            stream.getTracks().forEach(track => track.stop());
          };

          audioChunksRef.current = [];
          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (error) {
          console.error("Microphone access denied or error occurred.", error);
          alert("マイクへのアクセスが拒否されたか、エラーが発生しました。ブラウザの権限設定を確認してください。");
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      const clearAudio = () => {
        setAudioUrl(null);
      };

      return { isRecording, audioUrl, startRecording, stopRecording, clearAudio };
    };

    // --- 個別の問題コンポーネント ---
    const QuestionItem = ({ qData, index }) => {
      const isMultiselect = qData.type === 'multiselect';
      const isTextarea = qData.type === 'textarea';
      
      const [userAnswer, setUserAnswer] = useState(isMultiselect ? [] : '');
      const [status, setStatus] = useState('idle'); 
      const [showExplanation, setShowExplanation] = useState(false);
      
      const { isRecording, audioUrl, startRecording, stopRecording, clearAudio } = useAudioRecorder();

      const handleCheck = () => {
        let isCorrect = false;

        if (isMultiselect) {
          if (userAnswer.length === 0) return;
          const sortedUser = [...userAnswer].sort();
          const sortedAns = [...qData.a].sort();
          if (JSON.stringify(sortedUser) === JSON.stringify(sortedAns)) {
            isCorrect = true;
          }
        } else if (isTextarea && qData.keywords) {
          if (!userAnswer.trim()) return;
          const allKeywordsIncluded = qData.keywords.every(kw => userAnswer.includes(kw));
          isCorrect = allKeywordsIncluded;
        } else {
          const normalizedUser = userAnswer.trim().toLowerCase().replace(/\s+/g, ' ');
          if (normalizedUser === '') return;
          
          if (Array.isArray(qData.a)) {
            isCorrect = qData.a.some(ans => ans.trim().toLowerCase().replace(/\s+/g, ' ') === normalizedUser);
          } else {
            const normalizedAns = qData.a.trim().toLowerCase().replace(/\s+/g, ' ');
            isCorrect = normalizedUser === normalizedAns || (qData.a === "○" && userAnswer === "○") || (qData.a === "×" && userAnswer === "×") || (qData.a === "T" && userAnswer === "T") || (qData.a === "F" && userAnswer === "F");
          }
        }

        setStatus(isCorrect ? 'correct' : 'incorrect');
      };

      const handleReveal = () => {
        setStatus('revealed');
        setShowExplanation(true); 
      };

      const playAudio = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); 
          const utterance = new SpeechSynthesisUtterance(qData.audio);
          utterance.lang = 'en-US';
          utterance.rate = 0.9; 
          window.speechSynthesis.speak(utterance);
        } else {
          alert("お使いのブラウザは音声読み上げに対応していません。");
        }
      };

      return (
        <div className="bg-white rounded-xl shadow-md p-8 mb-8 border border-gray-100 transition-all">
          <div className="flex gap-6">
            <div className="flex-shrink-0 w-12 h-12 text-2xl bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold mt-1">
              {index + 1}
            </div>
            <div className="flex-grow">
              {qData.wordbank && (
                <div className="mb-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg text-2xl font-medium">
                  <span className="font-bold text-yellow-800">語群: </span> 
                  <span className="text-yellow-900 leading-relaxed">{qData.wordbank.join(', ')}</span>
                </div>
              )}

              <p className="text-3xl mb-6 whitespace-pre-wrap leading-relaxed" style={{ fontFamily: "'Times New Roman', Times, serif" }}>
                {qData.q}
              </p>

              <div className={`flex ${isTextarea ? 'flex-col' : 'flex-col sm:flex-row'} gap-4 mb-6 items-start ${isTextarea ? '' : 'sm:items-center'}`}>
                
                {qData.type === 'select' && (
                  <select 
                    className={`flex-grow border-2 p-4 rounded-lg text-2xl outline-none transition-colors cursor-pointer ${
                      status === 'idle' ? 'border-gray-300 focus:border-blue-500' :
                      status === 'correct' ? 'border-green-500 bg-green-50' : 
                      status === 'incorrect' ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-gray-100'
                    }`}
                    value={userAnswer}
                    onChange={(e) => {
                      setUserAnswer(e.target.value);
                      if (status !== 'idle') setStatus('idle');
                    }}
                    disabled={status === 'correct' || status === 'revealed'}
                  >
                    <option value="">選択してください</option>
                    {qData.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                  </select>
                )}

                {qData.type === 'multiselect' && (
                  <div className="flex flex-wrap gap-6 flex-grow items-center p-2">
                    {qData.options.map(opt => (
                      <label key={opt} className={`flex items-center gap-3 text-2xl cursor-pointer ${(status === 'correct' || status === 'revealed') ? 'opacity-70' : ''}`}>
                        <input 
                          type="checkbox" 
                          className="w-8 h-8 cursor-pointer accent-blue-600" 
                          checked={userAnswer.includes(opt)}
                          onChange={(e) => {
                            let newArr;
                            if(e.target.checked) newArr = [...userAnswer, opt];
                            else newArr = userAnswer.filter(item => item !== opt);
                            setUserAnswer(newArr);
                            if (status !== 'idle') setStatus('idle');
                          }}
                          disabled={status === 'correct' || status === 'revealed'}
                        />
                        <span className="font-bold">{opt}</span>
                      </label>
                    ))}
                  </div>
                )}

                {qData.type === 'textarea' && (
                  <textarea 
                    className={`w-full border-2 p-4 rounded-lg text-2xl outline-none transition-colors min-h-[120px] ${
                      status === 'idle' ? 'border-gray-300 focus:border-blue-500' :
                      status === 'correct' ? 'border-green-500 bg-green-50' : 
                      status === 'incorrect' ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-gray-100'
                    }`}
                    placeholder="日本語で解答を入力..."
                    value={userAnswer}
                    onChange={(e) => {
                      setUserAnswer(e.target.value);
                      if (status !== 'idle') setStatus('idle');
                    }}
                    disabled={status === 'correct' || status === 'revealed'}
                  />
                )}

                {(!qData.type || qData.type === 'text') && (
                  <input 
                    type="text" 
                    className={`flex-grow border-2 p-4 rounded-lg text-2xl outline-none transition-colors ${
                      status === 'idle' ? 'border-gray-300 focus:border-blue-500' :
                      status === 'correct' ? 'border-green-500 bg-green-50' : 
                      status === 'incorrect' ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-gray-100'
                    }`}
                    placeholder="解答を入力... (複数の単語はスペースで区切る)"
                    value={userAnswer}
                    onChange={(e) => {
                      setUserAnswer(e.target.value);
                      if (status !== 'idle') setStatus('idle');
                    }}
                    onKeyDown={(e) => e.key === 'Enter' && handleCheck()}
                    disabled={status === 'correct' || status === 'revealed'}
                  />
                )}

                <div className={`flex gap-3 ${isTextarea ? 'self-end' : ''}`}>
                  <button 
                    onClick={handleCheck}
                    disabled={(isMultiselect ? userAnswer.length === 0 : !userAnswer?.trim?.()) || status === 'correct' || status === 'revealed'}
                    className="bg-blue-600 text-white px-8 py-4 text-xl rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap transition-colors"
                  >
                    解答する
                  </button>
                  <button 
                    onClick={handleReveal}
                    disabled={status === 'correct' || status === 'revealed'}
                    className="bg-gray-500 text-white px-6 py-4 text-xl rounded-lg font-semibold hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap transition-colors"
                  >
                    答えを見る
                  </button>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
                <div>
                  {status !== 'idle' && (
                    <div className={`flex items-center gap-3 font-bold text-2xl ${
                      status === 'correct' ? 'text-green-600' : 
                      status === 'incorrect' ? 'text-red-600' : 'text-gray-600'
                    }`}>
                      {status === 'correct' ? <CheckCircle size={32} /> : 
                       status === 'incorrect' ? <XCircle size={32} /> : <BookOpen size={32} />}
                      {status === 'correct' ? '正解！よくできました！' : 
                       status === 'incorrect' ? (isTextarea ? '不正解... 指定のキーワードが含まれていません。' : '不正解... もう一度挑戦してみよう！') :
                       '解答を表示しました。'}
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setShowExplanation(!showExplanation)}
                  className="flex items-center justify-center gap-2 bg-gray-100 text-gray-700 px-6 py-3 text-lg rounded-lg hover:bg-gray-200 transition-colors font-semibold border border-gray-300"
                >
                  <BookOpen size={20} /> {showExplanation ? '解説を隠す' : '解説を見る'}
                </button>
              </div>

              {showExplanation && (
                <div className="bg-gray-50 border border-gray-200 rounded-lg p-6 mb-6 shadow-inner">
                  <div className="font-bold text-gray-700 mb-3 text-xl flex items-center gap-2">
                    <BookOpen size={24} className="text-blue-500" /> 
                    正答(模範解答): {Array.isArray(qData.a) ? qData.a.join(' / ') : qData.a}
                  </div>
                  <p className="text-gray-600 leading-relaxed text-xl whitespace-pre-wrap">{qData.exp}</p>
                </div>
              )}

              <div className="flex flex-wrap items-center gap-4 mt-8 pt-6 border-t border-gray-100">
                <button 
                  onClick={playAudio}
                  className="flex items-center gap-2 bg-purple-100 text-purple-700 px-6 py-3 text-lg rounded-full hover:bg-purple-200 transition-colors font-medium"
                >
                  <Volume2 size={24} /> {isTextarea ? "関連する英文を聴く" : "英文を聴く"}
                </button>

                <div className="h-8 w-px bg-gray-300 mx-2 hidden sm:block"></div>

                {!isRecording ? (
                  <button 
                    onClick={startRecording}
                    className="flex items-center gap-2 bg-red-100 text-red-700 px-6 py-3 text-lg rounded-full hover:bg-red-200 transition-colors font-medium"
                  >
                    <Mic size={24} /> 発音を録音する
                  </button>
                ) : (
                  <button 
                    onClick={stopRecording}
                    className="flex items-center gap-2 bg-gray-800 text-white px-6 py-3 text-lg rounded-full hover:bg-gray-700 transition-colors font-medium animate-pulse"
                  >
                    <Square size={24} fill="currentColor" /> 録音停止
                  </button>
                )}

                {audioUrl && (
                  <div className="flex items-center gap-3 ml-auto bg-green-50 px-4 py-2 rounded-full border border-green-200">
                    <span className="text-lg text-green-800 font-medium mr-2">録音データ:</span>
                    <audio src={audioUrl} controls className="h-10 w-64" />
                    <button onClick={clearAudio} className="text-gray-400 hover:text-red-500" title="削除">
                      <XCircle size={28} />
                    </button>
                  </div>
                )}
              </div>

            </div>
          </div>
        </div>
      );
    };

    // --- メインアプリケーション ---
    function App() {
      const [activeSectionIdx, setActiveSectionIdx] = useState(0);
      const activeSection = quizData[activeSectionIdx];

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activeSectionIdx]);

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-gray-800 flex flex-col md:flex-row">
          <aside className="w-full md:w-80 bg-white border-r border-gray-200 p-8 flex-shrink-0 md:sticky md:top-0 md:h-screen md:overflow-y-auto overflow-x-hidden shadow-sm z-10">
            <div className="mb-10">
              <h1 className="text-4xl font-black text-blue-800 leading-tight">
                English<br/>Workbook<br/>Companion
              </h1>
              <p className="text-lg text-gray-500 mt-4">Unit 2: Esports</p>
            </div>
            
            <nav className="space-y-4">
              {quizData.map((section, idx) => (
                <button
                  key={idx}
                  onClick={() => setActiveSectionIdx(idx)}
                  className={`w-full text-left px-6 py-4 rounded-lg text-xl font-medium transition-all duration-200 ${
                    activeSectionIdx === idx 
                      ? 'bg-blue-600 text-white shadow-md transform scale-[1.02]' 
                      : 'text-gray-600 hover:bg-blue-50'
                  }`}
                >
                  {section.section}
                </button>
              ))}
            </nav>
          </aside>

          <main className="flex-grow p-6 md:p-12 md:max-w-6xl mx-auto w-full">
            <header className="mb-12">
              <h2 className="text-5xl font-bold text-gray-800 mb-4">{activeSection.section}</h2>
              <p className="text-xl text-gray-600 leading-relaxed">左のメニューからセクションを切り替えられます。音声を聴いたり、自分の発音を録音して確認してみましょう。</p>
            </header>

            {activeSection.subsections.map((sub, subIdx) => (
              <section key={subIdx} className="mb-16">
                <div className="bg-blue-50 border-l-8 border-blue-500 p-6 mb-8 rounded-r-lg shadow-sm">
                  <h3 className="text-3xl font-bold text-blue-900">{sub.title}</h3>
                  <p className="text-xl text-blue-800 mt-3">{sub.instruction}</p>
                </div>

                <div className="space-y-6">
                  {sub.questions.map((q, qIdx) => (
                    <QuestionItem key={q.id} qData={q} index={qIdx} />
                  ))}
                </div>
              </section>
            ))}
            
            <footer className="text-center text-gray-400 mt-16 mb-10 text-xl border-t border-gray-200 pt-8">
              Keep up the good work! Continuous practice leads to success.
            </footer>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
